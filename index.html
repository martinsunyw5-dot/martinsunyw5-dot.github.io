<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我的个人主页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #0066cc; }
        p { line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>你好，我是 [你的名字] 👋</h1>
        <p>欢迎来到我的第一个 GitHub Pages 网站！</p>
        <p>这里是我探索技术与记录生活的小天地。</p>
    </div>
</body>
</html>
